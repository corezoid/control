{{- $currentScope := .Values.global.dashboards }}
{{- if and $currentScope.enabled .Values.global.serviceMonitor.enabled}}
{{ range $path, $_ :=  $.Files.Glob  "mixins/dashboards/*.json" }}
{{ $file := $path | base }}
{{ $name := print ($file | trimSuffix ".json")  "-dashboard" }}
{{- with $currentScope}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # CE-16140: a large dashboard (sim-api.json, 227 KB) plus the last-applied copy of client-side apply passed the 256 KB
    # annotation limit and stopped the ArgoCD sync; server-side apply keeps no such copy
    argocd.argoproj.io/sync-options: ServerSideApply=true
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ $file }}: |-
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}
{{ end }}
{{- end }}
