{{- if eq .Values.global.redis.internal true }}
{{- if .Values.global.redis.persistantVolumeClaimName }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.global.redis.persistantVolumeClaimName }}
  annotations:
    volume.beta.kubernetes.io/storage-class: {{ .Values.global.storageClassName }}
  labels:
{{- include "redis.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.global.storageClassName }}
  {{- with .Values.global.redis.volumeName }}
  # bound PV; keeps the spec identical to the live claim so Argo Replace sync does not fail
  volumeName: {{ . }}
  {{- end }}
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
{{- end }}
{{- end }}
