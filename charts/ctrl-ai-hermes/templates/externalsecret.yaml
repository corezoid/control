{{- if include "ctrl-ai-hermes.enabled" . }}
{{- $h := .Values.global.control.ctrl_ai_hermes }}
{{- $es := $h.secret.externalSecret | default dict }}
{{- if $es.enabled }}
{{- $remoteKey := required "global.control.ctrl_ai_hermes.secret.externalSecret.remoteKey: the secret's name in the store, e.g. /<cluster>/sim-ai-hermes-<env>" $es.remoteKey }}
# The Hermes Secret from the secret store (AWS Secrets Manager). Keys: LITELLM_API_KEY (the stand's LiteLLM
# virtual key), HERMES_API_KEY (also sim-api ai.hermes.token), HERMES_CREDENTIAL_KEY (also sim-api
# ai.hermes.runCredentialToken; ≥ 32 chars, not equal to HERMES_API_KEY). sim-api reads the last two from
# the same secret itself (${aws:<region>/<remoteKey>.<KEY>}), so its IRSA role needs GetSecretValue on it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $h.secret.name }}
  labels:
    {{- include "ctrl-ai-hermes.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "5m" }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target: { name: {{ $h.secret.name }} }
  data:
    {{- range $key := required "global.control.ctrl_ai_hermes.secret.externalSecret.keys: the Secret's keys" $es.keys }}
    - { secretKey: {{ $key }}, remoteRef: { key: {{ $remoteKey }}, property: {{ $key }} } }
    {{- end }}
{{- end }}
{{- end }}
