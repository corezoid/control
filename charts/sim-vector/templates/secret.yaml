{{- $sim_vector_data := .Values.global.control.sim_vector }}
{{- if and (hasKey .Values.global.control "sim_vector") (hasKey .Values.global.control.sim_vector "enabled") $sim_vector_data.enabled }}
{{- with $sim_vector_data.embedding }}
{{- if .apigwToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sim-vector.secretName" $ }}
  labels:
    {{- include "sim-vector.labels" $ | nindent 4 }}
type: Opaque
data:
  # Bearer token sim-vector sends to the Corezoid embedding process (EMBEDDING_APIGW_TOKEN).
  embeddingApigwToken: {{ .apigwToken | toString | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
