{{- $global_data := .Values.global }}
{{- $control_data := $global_data.control }}
{{- $sim_vector_data := $global_data.control.sim_vector }}
{{- if and (hasKey .Values.global.control "sim_vector") (hasKey .Values.global.control.sim_vector "enabled") $sim_vector_data.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  labels:
    {{- include "sim-vector.labels" . | nindent 4 }}
spec:
  {{- if not $sim_vector_data.autoscaling.enabled }}
  replicas: {{ $sim_vector_data.autoscaling.minReplicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sim-vector.labels" . | nindent 6 }}
  template:
    metadata:
      annotations: {}
      labels:
        {{- include "sim-vector.labels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range $pullSecret := $global_data.imagePullSecrets }}
        - name: {{ $pullSecret }}
      {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml $global_data.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "InitWait.postgres" . | nindent 8 }}
        {{- include "InitWait.postgres-extension-vector" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml $global_data.securityContext | nindent 12 }}
          image: {{ include "sim-vector.imageUrl" . | quote }}
          imagePullPolicy: {{ $sim_vector_data.pullPolicy | default "IfNotPresent" }}
          env:
            - name: BATCH_SIZE
              value: "{{ $sim_vector_data.batchSize }}"
            - name: VECTORIZATION_BATCH_SIZE
              value: "{{ $sim_vector_data.VectorizationbatchSize }}"
            {{- if $sim_vector_data.retryMaxDelay }}
            - name: RETRY_MAX_DELAY
              value: "{{ $sim_vector_data.retryMaxDelay }}"
            {{- end }}
            - name: SLEEP_INTERVAL
              value: "{{ $sim_vector_data.sleepInterval }}"
            - name: ALLOW_SEARCH
              value: "{{ $sim_vector_data.allowSearch }}"
            {{- if hasKey .Values.global.control "simTei" }}
            - name: EMBEDDING_DENSE_URL
              {{- if and (hasKey .Values.global.control.simTei "teiDomain") .Values.global.control.simTei.teiDomain }}
              value: "https://{{ .Values.global.control.simTei.teiDomain }}"
              {{- else }}
              value: "http://sim-tei-service:80"
              {{- end }}
            {{- end }}
            {{- if hasKey .Values.global.control "sim_vector" }}
            {{- if .Values.global.control.sim_vector.milvusHost }}
            - name: MILVUS_HOST
              value: "{{ .Values.global.control.sim_vector.milvusHost }}"
            {{- end }}
            {{- if .Values.global.control.sim_vector.milvusPort }}
            - name: MILVUS_PORT
              value: "{{ .Values.global.control.sim_vector.milvusPort }}"
            {{- end }}
            {{- if .Values.global.control.sim_vector.env }}
            - name: ENV
              value: "{{ .Values.global.control.sim_vector.env }}"
            {{- end }}
            - name: MILVUS_COLLECTION
              value: "{{ .Values.global.control.sim_vector.milvusCollection }}"
            - name: MILVUS_VECTOR_SIZE
              value: "{{ .Values.global.control.sim_vector.milvusVectorSize }}"
            - name: MILVUS_INDEX_TYPE
              value: "{{ .Values.global.control.sim_vector.milvusIndexType }}"
            - name: SIM_VECTOR_NAME
              value: "{{ .Values.global.control.sim_vector.simVectorName }}"
            {{- end }}
            {{- with $sim_vector_data.embedding }}
            {{- if .provider }}
            - name: EMBEDDING_PROVIDER
              value: {{ .provider | quote }}
            {{- end }}
            {{- if has (.provider | default "tei") (list "apigw" "hybrid") }}
            - name: EMBEDDING_APIGW_URL
              value: {{ required "global.control.sim_vector.embedding.apigwUrl is required when provider is apigw or hybrid" .apigwUrl | quote }}
            {{- end }}
            {{- if .apigwToken }}
            - name: EMBEDDING_APIGW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sim-vector.secretName" $ }}
                  key: embeddingApigwToken
            {{- end }}
            {{- if .apigwMaxBatchSize }}
            - name: EMBEDDING_APIGW_MAX_BATCH_SIZE
              value: {{ .apigwMaxBatchSize | quote }}
            {{- end }}
            {{- if .timeout }}
            - name: EMBEDDING_TIMEOUT
              value: {{ .timeout | quote }}
            {{- end }}
            {{- if .apigwTimeout }}
            - name: EMBEDDING_APIGW_TIMEOUT
              value: {{ .apigwTimeout | quote }}
            {{- end }}
            {{- if hasKey . "hybridCooldown" }}
            - name: EMBEDDING_HYBRID_COOLDOWN
              value: {{ .hybridCooldown | quote }}
            {{- end }}
            {{- if .apigwMode }}
            {{- if eq .apigwMode "async" }}
            {{- if ne (.provider | default "tei") "apigw" }}
            {{- fail "global.control.sim_vector.embedding.apigwMode async works only with provider apigw" }}
            {{- end }}
            {{- if not .apigwCallbackUrl }}
            {{- fail "global.control.sim_vector.embedding.apigwCallbackUrl is required for apigwMode async" }}
            {{- end }}
            {{- end }}
            - name: EMBEDDING_APIGW_MODE
              value: {{ .apigwMode | quote }}
            {{- end }}
            {{- if .apigwCallbackUrl }}
            - name: EMBEDDING_APIGW_CALLBACK_URL
              value: {{ .apigwCallbackUrl | quote }}
            {{- end }}
            {{- if .apigwCallbackTimeout }}
            - name: EMBEDDING_APIGW_CALLBACK_TIMEOUT
              value: {{ .apigwCallbackTimeout | quote }}
            {{- end }}
            {{- if .apigwMaxInFlight }}
            - name: EMBEDDING_APIGW_MAX_IN_FLIGHT
              value: {{ .apigwMaxInFlight | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.global.control.auth.key }}
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "control.configSecretName" . }}
                  key: configSaSecretKey
            {{- end }}
            {{- include "control.container_envs_db" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 180
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $sim_vector_data.resources | nindent 12 }}
      {{- with $sim_vector_data.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sim_vector_data.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sim_vector_data.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
