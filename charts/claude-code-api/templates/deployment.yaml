{{- $global_data := .Values.global }}
{{- $control_data := $global_data.control }}
{{- $claude_code_api_data := $global_data.control.claude_code_api }}
{{- if and (hasKey .Values.global.control "claude_code_api") (hasKey .Values.global.control.claude_code_api "enabled") $claude_code_api_data.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  labels:
    {{- include "claude-code-api.labels" . | nindent 4 }}
spec:
  {{- if not $claude_code_api_data.autoscaling.enabled }}
  replicas: {{ $claude_code_api_data.autoscaling.minReplicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "claude-code-api.labels" . | nindent 6 }}
  template:
    metadata:
      annotations: {}
      labels:
        {{- include "claude-code-api.labels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range $pullSecret := $global_data.imagePullSecrets }}
        - name: {{ $pullSecret }}
      {{- end }}
      {{- end }}
      securityContext:
        fsGroup: 1001
        {{- with $global_data.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      initContainers:
        {{- include "InitWait.postgres" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml $global_data.securityContext | nindent 12 }}
          image: {{ include "claude-code-api.imageUrl" . | quote }}
          imagePullPolicy: {{ $claude_code_api_data.pullPolicy | default "IfNotPresent" }}
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8000"
            - name: MCP_SERVER_PORT
              value: "{{ $claude_code_api_data.mcp_server_port | default 8001 }}"
            - name: MCP_ACCOUNT_URL
              value: "{{ $claude_code_api_data.mcp_account_url | default "https://account.dev.corezoid.com" }}"
            - name: MCP_SIMULATOR_URL
              value: "{{ $claude_code_api_data.mcp_simulator_url | default "https://sim-dev.simulator.company" }}"
            - name: MCP_RESOURCE_URL
              value: "{{ $claude_code_api_data.mcp_resource_url | default "https://mcp-dev.simulator.company" }}"
            {{- /* The service's own public origin. Besides documentation it is
                   the base of the OAuth callback handed to MCP providers
                   (<API_URL>/integrations/oauth/callback), which a provider
                   matches byte for byte — so it must be the externally
                   reachable https address, not a pod-local one. Derived from
                   the ingress host unless overridden. */}}
            - name: API_URL
              value: "{{ $claude_code_api_data.api_url | default (printf "https://%s" $claude_code_api_data.claudeCodeApiDomain) }}"
            {{- if and (hasKey $claude_code_api_data "corezoid_mcp_simulator_secret") $claude_code_api_data.corezoid_mcp_simulator_secret }}
            - name: COREZOID_MCP_SIMULATOR_SECRET
              value: "{{ $claude_code_api_data.corezoid_mcp_simulator_secret }}"
            {{- end }}
            - name: DB_CLAUDECODE_NAME
              value: "{{ $claude_code_api_data.db.secret.data.dbname | default ($claude_code_api_data.dbname | default "claude_code") }}"
            - name: DATABASE_TIMEZONE
              value: "{{ $claude_code_api_data.db_timezone | default "UTC" }}"
            - name: LOG_LEVEL
              value: "{{ $claude_code_api_data.log_level }}"
            - name: LOG_FORMAT
              value: "{{ $claude_code_api_data.log_format | default "json" }}"
            - name: LITELLM_SPEND_KEY
              value: "{{ $claude_code_api_data.litellm_spend_key | default "sk-1234" }}"
            - name: LITELLM_SPEND_PULL_BUDGET_MINUTES
              value: "{{ $claude_code_api_data.litellm_spend_pull_budget_minutes | default 30 }}"
            {{- /* LiteLLM management API: workspace technical user + virtual keys.
                   Both are required together — cc-api answers 501 on the
                   provisioning endpoints unless each is non-empty. Rendered only
                   when set, deliberately without a chart default: a default here
                   would silently arm the feature on every environment. */}}
            {{- if and (hasKey $claude_code_api_data "litellm_base_url") $claude_code_api_data.litellm_base_url }}
            - name: LITELLM_BASE_URL
              value: "{{ $claude_code_api_data.litellm_base_url }}"
            {{- end }}
            {{- if and (hasKey $claude_code_api_data "litellm_admin_key") $claude_code_api_data.litellm_admin_key }}
            - name: LITELLM_ADMIN_KEY
              value: "{{ $claude_code_api_data.litellm_admin_key }}"
            {{- end }}
            {{- if and (hasKey $claude_code_api_data "auth_api_key") $claude_code_api_data.auth_api_key }}
            - name: AUTH_API_KEY
              value: "{{ $claude_code_api_data.auth_api_key }}"
            {{- end }}
            {{- if and (hasKey $claude_code_api_data "tls") (eq $claude_code_api_data.tls false) }}
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            {{- end }}
            {{- if and (hasKey $claude_code_api_data "git_token") $claude_code_api_data.git_token }}
            - name: GIT_TOKEN
              value: "{{ $claude_code_api_data.git_token }}"
            {{- end }}
            {{- if and (hasKey $claude_code_api_data "otel") $claude_code_api_data.otel.enabled }}
            - name: TELEMETRY_ENABLED
              value: "true"
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ $claude_code_api_data.otel.endpoint }}"
            - name: OTEL_SERVICE_NAME
              value: "{{ $claude_code_api_data.otel.service_name | default "cc-api" }}"
            {{- end }}
            {{- include "claude-code-api.container_envs_db" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: mcp
              containerPort: {{ $claude_code_api_data.mcp_server_port | default 8001 }}
              protocol: TCP
          resources:
            {{- toYaml $claude_code_api_data.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /tmp
      volumes:
        - name: workspace
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "claude-code-api.labels" . | nindent 18 }}
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: {{ $claude_code_api_data.workspace_storage_class | default .Values.global.storageClassName }}
                resources:
                  requests:
                    storage: {{ $claude_code_api_data.workspace_size | default "100Gi" }}
      {{- with $claude_code_api_data.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $claude_code_api_data.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $claude_code_api_data.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
