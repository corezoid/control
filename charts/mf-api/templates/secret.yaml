{{- $mf_api_data := index .Values.global.control "mf-api" }}
{{- if and (hasKey .Values.global.control "mf-api") (hasKey $mf_api_data "enabled") $mf_api_data.enabled }}
{{- if $mf_api_data.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mf-api.secretName" . }}
  labels:
    {{- include "mf-api.labels" . | nindent 4 }}
type: Opaque
data:
  # apiSecret guards the /api/v1 routes. It defaults to the platform auth key,
  # the same way ufs does, so a control client already holding that key can
  # call mf-api without a second credential. Leave mf-api.secret.data.apiSecret
  # unset unless mf-api needs a credential of its own.
  apiSecret: {{ $mf_api_data.secret.data.apiSecret | default .Values.global.control.auth.key | b64enc | quote }}
  # Bearer token for the /v1 routes of claude-code-api.
  ccWorkspaceSecret: {{ $mf_api_data.secret.data.ccWorkspaceSecret | default "" | b64enc | quote }}
  # Key the upstream LLM gateway (ccApi.aiUrl) accepts. Empty leaves cc-api on
  # whatever model credential it is configured with itself.
  ccAiToken: {{ $mf_api_data.secret.data.ccAiToken | default "" | b64enc | quote }}
  # Simulator API key of the system workspace the migration form lives in.
  systemApiKey: {{ $mf_api_data.secret.data.systemApiKey | default "" | b64enc | quote }}
  # Firecrawl API key (fc-...) for the instance at firecrawl.baseUrl. Empty
  # leaves website sources without a credential and the upstream answers 401.
  firecrawlApiKey: {{ $mf_api_data.secret.data.firecrawlApiKey | default "" | b64enc | quote }}
  # TypeSafe System One key (apikey_...), which names a document's category.
  # Empty turns classification off rather than failing a source: a session whose
  # documents have no category still analyses, builds and finishes.
  typesafeApiKey: {{ $mf_api_data.secret.data.typesafeApiKey | default "" | b64enc | quote }}
  # The one Airbyte application of the instance at airbyte.baseUrl — the
  # community edition has a single one and no users, so these two are shared
  # with every other integration on it and rotating them is never local to us.
  # Empty (either of them) leaves airbyte disabled: Drive folders as sources are
  # refused, everything else works.
  airbyteClientId: {{ $mf_api_data.secret.data.airbyteClientId | default "" | b64enc | quote }}
  airbyteClientSecret: {{ $mf_api_data.secret.data.airbyteClientSecret | default "" | b64enc | quote }}
  # Simulator key that signs the view links handed out for a layer the visitor
  # has no personal access to (the templates, an anonymous session's clone).
  # Empty falls back to systemApiKey, which is what every mw deployment wants —
  # set it only where the signer is a different account than the system key.
  viewSignerKey: {{ $mf_api_data.secret.data.viewSignerKey | default "" | b64enc | quote }}
  # API key for the Hermes gateway at hermes.baseUrl. Profile and key travel
  # together — a multiplexing gateway serves every profile off the same
  # listener, each with its own key, and the default profile's key on a
  # secondary profile's route is refused outright. Empty leaves Hermes
  # unreachable; build.runner still decides whether anything tries to use it.
  hermesApiKey: {{ $mf_api_data.secret.data.hermesApiKey | default "" | b64enc | quote }}
{{- end }}
{{- end }}
