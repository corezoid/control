{{- $ufs_data := .Values.global.control.ufs }}
{{- if and (hasKey .Values.global.control "ufs") (hasKey .Values.global.control.ufs "enabled") $ufs_data.enabled }}
{{- if $ufs_data.secret.create }}
{{- $d := $ufs_data.secret.data }}
{{- /* empty db fields fall back to the control DB server and app user */}}
{{- $gdb := .Values.global.db.secret.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ufs.secretName" . }}
  labels:
    {{- include "ufs.labels" . | nindent 4 }}
type: Opaque
data:
  dbhost: {{ $d.dbhost | default $gdb.dbhost | default "" | b64enc | quote }}
  dbport: {{ $d.dbport | default $gdb.dbport | default "5432" | toString | b64enc | quote }}
  dbuser: {{ $d.dbuser | default $gdb.dbuser | default "" | b64enc | quote }}
  dbpwd: {{ $d.dbpwd | default $gdb.dbpwd | default "" | b64enc | quote }}
  dbname: {{ $d.dbname | default "ufs" | b64enc | quote }}
  apiSecret: {{ .Values.global.control.auth.key | b64enc }}
  clamavAddress: {{ $ufs_data.antivirus.clamav.address | default $d.clamavAddress | default "clamav:3310" | b64enc | quote }}
  syncapiHost: {{ $ufs_data.antivirus.syncapi.host | default "" | b64enc  | quote }}
  syncapiLogin: {{ $ufs_data.antivirus.syncapi.apiLogin | default "" | b64enc  | quote }}
  syncapiSecret: {{ $ufs_data.antivirus.syncapi.apiSecret | default "" | b64enc  | quote }}
  syncapiCompanyId: {{ $ufs_data.antivirus.syncapi.companyId | default "" | b64enc  | quote }}
  syncapiConvId: {{ $ufs_data.antivirus.syncapi.convId | default "" | toString | b64enc | quote }}
  corezoidUrl: {{ $ufs_data.antivirus.corezoid.url | default "" | b64enc  | quote  }}
  s3Endpoint: {{ $ufs_data.storage.s3.endpoint | default "" | b64enc | quote }}
  s3AccessKeyId: {{ $ufs_data.storage.s3.accessKeyId | default "" | b64enc | quote }}
  s3SecretAccessKey: {{ $ufs_data.storage.s3.secretAccessKey | default "" | b64enc | quote }}
  seaweedfsEndpoint: {{ $ufs_data.storage.seaweedfs.endpoint | default "" | b64enc | quote }}
{{- end }}
{{- end }}
